<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 背景サークル -->
  <rect width="100" height="100" rx="28" fill="#0f172a" />
  
  <!-- ラジオボディ -->
  <rect x="20" y="35" width="60" height="45" rx="8" fill="url(#grad)" filter="url(#glow)" />
  
  <!-- アンテナ -->
  <line x1="30" y1="35" x2="15" y2="15" stroke="url(#grad)" stroke-width="4" stroke-linecap="round" />
  <circle cx="15" cy="15" r="4" fill="#10b981" />

  <!-- スピーカー -->
  <circle cx="42" cy="57" r="14" fill="#0f172a" />
  <circle cx="42" cy="57" r="9" fill="url(#grad)" opacity="0.8" />
  <circle cx="42" cy="57" r="4" fill="#0f172a" />

  <!-- チューナー / ダイヤル -->
  <circle cx="68" cy="48" r="5" fill="#0f172a" />
  <circle cx="68" cy="64" r="5" fill="#0f172a" />

  <!-- 電波エフェクト -->
  <path d="M 12 8 A 12 12 0 0 1 24 20" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 8 4 A 18 18 0 0 1 28 24" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>
